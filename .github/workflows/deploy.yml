name: Build and Deploy (Full-Stack)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write  # Crucial to allow deploying to gh-pages branch

jobs:
  # JOB 1: Deploy Backend to Render using Webhook
  deploy-backend:
    name: Trigger Render Backend Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning:: Secret 'RENDER_DEPLOY_HOOK' is not set! Skipping backend trigger. Please configure this secret in GitHub repository settings to automate Render deployment."
          else
            echo "Triggering Render webhook..."
            curl -s -f "$RENDER_DEPLOY_HOOK" > /dev/null
            echo "Render deployment triggered successfully!"
          fi

  # JOB 2: Build and Deploy Frontend to GitHub Pages
  deploy-frontend:
    name: Build & Publish React to GitHub Pages
    needs: deploy-backend  # Deploy frontend after triggering backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      # Build React injects your secure Render API URL as the base client address
      - name: Build Production Bundle
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::warning:: Secret 'RENDER_APP_URL' is not set! Using relative '/api' endpoints for production. Configure 'RENDER_APP_URL' in GitHub repository secrets if your backend is deployed."
          fi
          npm run build

      # Publishes Vite build output (dist) directly to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
